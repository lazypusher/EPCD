# ============================================================================
# EPCD DSH Agent —— Nginx 反向代理站点配置（方案 A：单一端口 loopback 收敛入口）
#
# 解决的问题：
#   @linxin666/dsh-ssh 的 /api/dsh-ssh/* 端点带 loopback-only trust fence：
#   要求 socket 源地址 AND Host 头都是 loopback（127/8、::1），且永不信任
#   X-Forwarded-For，也没有白名单配置。用户从内网 IP 直连 DSH 时，页面能开，
#   但 SSH tab 报 `forbidden: loopback-only`。旧方案（每用户手动 SSH 隧道）麻烦。
#
# 本方案：
#   用户只访问 http://<内网IP>:8080（Nginx 对外单一端口），Nginx 把每一条请求
#   proxy_pass 到本机 127.0.0.1:8091（DSH 仍在跑），于是：
#     - socket 源地址 = 127.0.0.1 → 满足 fence 第一条件（对所有请求都成立）
#     - SSH API 路由额外把 Host 头改成 127.0.0.1:8091 → 满足 fence 第二条件
#     - 页面/其它路由保持原始 Host（内网IP），DSH 绑 0.0.0.0 时已自动信任 LAN
#       IP（web-app 的 resolveLanTrust），token 鉴权照常工作
#
# ⚠ Nginx proxy_set_header 继承陷阱（本配置已规避）：
#   location 块内一旦出现任意 proxy_set_header，会清空从 server 块继承来的全部
#   proxy_set_header。因此 WebSocket 升级头（Upgrade/Connection）与 Host 等必须
#   在每个 location 块内完整重写，否则 WS 升级会退化为普通 GET → 404。
#
# 依赖（由 setup-nginx.sh 满足）：
#   - 服务器已装 nginx；本配置监听 8080（对外）
#   - DSH 以 EPCD_HOST=0.0.0.0 --port 8091 启动（绑所有接口，但由 Nginx 单一入口收敛）
# ============================================================================

# WebSocket 升级需要 nginx 1.3.13+；map 用于升级头透传
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 对外单一端口（内网用户只访问这个）
    listen 8080;
    server_name _;

    # 长连接/终端不超时
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    # 关闭大响应缓冲，SSE/NDJSON 流式透传
    proxy_buffering off;

    # ── SSH API：改 Host 为 loopback，通过 dsh-ssh loopback fence ────────────
    location /api/dsh-ssh/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8091;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 页面 + 其余 API：保持原始 Host（内网 IP），token 鉴权走 LAN 信任 ─────
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}