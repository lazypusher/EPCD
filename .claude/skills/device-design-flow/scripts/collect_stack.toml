# Stack-inductor config: stack_inductor REQUIRES a top-level sweep even for
# point-mode objectives (empirically: succeeded job but empty targetValues →
# OPTIMIZATION_PAUSED; with a 1-3GHz sweep it returns 402 targetValues).
# Identical elsewhere to scripts/collect.toml.

[server]
ssh_host = "zhubo@192.168.20.243"
pkg_root = "/package/eda9cube-d2026.06.6092-2026_06_sp1-g317a9fd-NINECUBE-2026-08-07-linux-x86-64-default"
technology = "/home/zhubo/demo_revised.ptxt"
work_dir_root = "/home/zhubo/epcd-runs"

category = "inductor"

[[templates]]
id = 1
name = "simple_inductor"
template_id = "system.inductor.simple_inductor"

[[templates]]
id = 2
name = "adv_simple_inductor"
template_id = "system.inductor.adv_simple_inductor"

[[templates]]
id = 3
name = "bowtie_inductor"
template_id = "system.inductor.bowtie_inductor"

[[templates]]
id = 4
name = "differential_inductor"
template_id = "system.inductor.differential_inductor"

[[templates]]
id = 5
name = "differential_inductor_step"
template_id = "system.inductor.differential_inductor_step"

[[templates]]
id = 6
name = "stack_inductor"
template_id = "system.inductor.stack_inductor"

[[templates]]
id = 7
name = "stack_inductor_overlapped"
template_id = "system.inductor.stack_inductor_overlapped"

[optimizer]
max_rounds = 20
startup_trials = [3, 5, 10]
seed = 20260817
max_wall_seconds = 3600.0

[simulation]
# stack_inductor's EM emits NO targetValues from a point-mode evaluation
# without a sweep (verified). force_sweep=true derives a MINIMAL coverage
# window over the objective freqs (point @2.5 → 2.4..2.6GHz, 3 points) —
# enough for scoring, not the slow default 1-3GHz band.
force_sweep = true
# alternative: explicit sweep = { start = "1GHz", stop = "3GHz", step = "10MHz" }

[objectives]
# defaults = live built-ins (point @2.5). Leave empty.

[output]
out_dir = "collect-out-stk"

[cleanup]
delete_run_dirs = true